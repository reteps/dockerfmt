on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  CGO_ENABLED: 0
  VERSION: ${{ github.ref_name }}
  PRERELEASE: ${{ github.event.release.prerelease }}

jobs:
  release-docker:
    name: Release Docker Image
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -ldflags=-X=github.com/reteps/dockerfmt/cmd.Version=${{ github.ref_name }}
      KO_DEFAULTPLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: ko-build/setup-ko@v0.8
      # Prereleases get only their version tag, so `latest` and `alpine` keep
      # pointing at the newest stable release.
      - name: Build and push Docker image
        run: |
          TAGS="${VERSION}"
          if [ "${PRERELEASE}" != "true" ]; then
            TAGS="${TAGS},latest"
          fi
          ko build --bare --tags "${TAGS}" \
            --image-label "org.opencontainers.image.version=${VERSION}" \
            --image-label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
      # Same binary on an Alpine base, so the image ships a shell (/bin/sh).
      # Needed by CI systems such as GitLab CI that run job scripts in a shell.
      - name: Build and push Alpine-based Docker image
        run: |
          TAGS="${VERSION}-alpine"
          if [ "${PRERELEASE}" != "true" ]; then
            TAGS="${TAGS},alpine"
          fi
          ko build --bare --tags "${TAGS}" \
            --image-label "org.opencontainers.image.version=${VERSION}" \
            --image-label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
        env:
          KO_DEFAULTBASEIMAGE: alpine:3
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
    - uses: actions/checkout@v4
    - uses: wangyoucao577/go-release-action@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        goos: ${{ matrix.goos }}
        goarch: ${{ matrix.goarch }}
        ldflags: -X github.com/reteps/dockerfmt/cmd.Version=${{ github.ref_name }}
  # The binaries above are already static (CGO_ENABLED=0) and run on musl-based
  # systems like Alpine. This job re-publishes the linux ones under a clearly
  # "musl"-labeled asset name so musl users have an obvious download.
  releases-musl-matrix:
    name: Release Go Binary (musl)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
    - uses: actions/checkout@v4
    - uses: wangyoucao577/go-release-action@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        goos: ${{ matrix.goos }}
        goarch: ${{ matrix.goarch }}
        asset_name: dockerfmt-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}-musl
        ldflags: -X github.com/reteps/dockerfmt/cmd.Version=${{ github.ref_name }}
