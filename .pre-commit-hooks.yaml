---
- additional_dependencies:
    - ./cmd
    - ./lib
  alias: dockerfmt
  args:
    - --write
    - --newline
    - --space-redirects
  description: Format Dockerfile files
  entry: dockerfmt
  files: (?i)(^|/)[^/]*(container|docker)file[^/]*$
  id: dockerfmt
  language: golang
  name: dockerfmt
  pass_filenames: true
  require_serial: false
  exclude: (?i)\.dockerignore$
