---
- additional_dependencies:
    - ./cmd
    - ./lib
  alias: dockerfmt
  args:
    - --write
    - --newline
  description: Format Dockerfile files
  entry: dockerfmt
  files: (?i)(^|/)[^/]*(container|docker)file[^/]*$
  id: dockerfmt
  language: golang
  name: dockerfmt
  pass_filenames: true
  require_serial: false
  # Also matches names like Dockerfile.prod; these extensions are other kinds
  # of files about Dockerfiles.
  exclude: (?i)(\.dockerignore|\.(md|txt|go|py|js|ts|sh|json|ya?ml|j2|tmpl|tpl))$
